[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "nux-mg50-mcp"
version = "0.2.0"
description = "Local MCP server for controlling a NUX MG-50Li through NUX Audio on macOS"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "NUX MG-50Li MCP contributors" }]
keywords = ["nux", "mg-50li", "mcp", "guitar", "macos"]
dependencies = ["mcp>=2.1.1,<3", "pydantic>=2.10,<3"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.9"]

[project.scripts]
nux-mg50-mcp = "nux_mg50_mcp.server:main"
nux-mg50 = "nux_mg50_mcp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/nux_mg50_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
